<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VJ STUDIO</title>
<style>
  :root{
    --bg:#161619; --panel:#222227; --line:#34343c; --line2:#46464f;
    --ink:#eaeaec; --dim:#9696a0; --faint:#5c5c66;
    --accent:#ff8a3d;
    --cyan:#22d3ee; --amber:#f59e0b; --green:#34d399; --fuchsia:#e879f9; --red:#f87171;
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,'Hiragino Sans','Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-user-select:none;user-select:none;overflow:hidden;}

  /* ===================== CONTROL ===================== */
  #control{display:flex;flex-direction:column;height:100%;}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);
    background:var(--panel);flex-wrap:wrap;}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:3px;font-size:18px;}
  .brand .dot{color:var(--cyan);}
  .spacer{flex:1;}
  .grp{display:flex;align-items:center;gap:6px;}
  .lab{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;}

  button{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink);
    background:transparent;border:1px solid var(--line2);padding:7px 12px;cursor:pointer;
    text-transform:uppercase;transition:all .12s;border-radius:0;}
  button:hover{border-color:var(--ink);}
  button.on{border-color:var(--cyan);color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan);}
  button.warn{border-color:var(--line2);}
  button.warn:hover{border-color:var(--amber);color:var(--amber);}
  button.danger:hover{border-color:var(--red);color:var(--red);}
  button.go{border-color:var(--green);color:var(--green);}
  button.go:hover{box-shadow:inset 0 0 0 1px var(--green);}

  .toggle{display:flex;border:1px solid var(--line2);}
  .toggle button{border:0;border-right:1px solid var(--line2);}
  .toggle button:last-child{border-right:0;}

  /* preset palette */
  .palette{display:flex;gap:8px;align-items:center;}
  .preset{width:64px;height:42px;border:1px solid var(--line2);display:flex;align-items:center;
    justify-content:center;font-family:var(--mono);font-size:9px;letter-spacing:1px;cursor:grab;
    text-align:center;line-height:1.2;}
  .preset:active{cursor:grabbing;}
  .preset.white{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#e0e0e0 4px,#e0e0e0 8px);color:#000;}
  .preset.black{background:repeating-linear-gradient(45deg,#000,#000 4px,#1c1c1c 4px,#1c1c1c 8px);color:#fff;border-color:var(--line2);}

  /* keyboard */
  #stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:18px;gap:10px;overflow:auto;}
  #keyboard{display:flex;flex-direction:column;gap:8px;width:100%;max-width:1500px;}
  .krow{display:flex;gap:8px;justify-content:center;}
  .key{position:relative;flex:1 1 0;height:clamp(80px,13vh,156px);min-width:0;border:1px solid var(--line);
    background:#1c1c21;display:flex;align-items:flex-end;justify-content:flex-start;
    overflow:hidden;cursor:pointer;transition:border-color .1s,transform .05s;}
  .key:hover{border-color:var(--line2);}
  .key.wide{flex:2.4 1 0;}
  .key.wider{flex:0 0 clamp(150px,16vw,260px);}
  .krow-bottom{height:clamp(140px,22vh,260px);align-items:stretch;margin-top:6px;gap:10px;}
  .krow-bottom .key{height:auto;}
  .key.sel{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan);}
  .key.flash{border-color:#fff;box-shadow:inset 0 0 0 2px #fff;transform:scale(.97);}
  .key.special{background:#0c0c0c;border-style:dashed;border-color:var(--line2);cursor:default;}
  .key.dragover{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green);}
  .key .thumb{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.92;}
  .key.strobe-white .thumb{background:repeating-linear-gradient(45deg,#fff,#fff 6px,#ddd 6px,#ddd 12px);}
  .key.strobe-black .thumb{background:repeating-linear-gradient(45deg,#000,#000 6px,#222 6px,#222 12px);}
  .key .klabel{position:relative;z-index:2;font-family:var(--mono);font-weight:700;font-size:13px;
    padding:3px 6px;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000;letter-spacing:1px;}
  .key.special .klabel{color:var(--dim);text-shadow:none;font-size:11px;letter-spacing:0;}
  .key .name{position:absolute;left:0;right:0;bottom:0;z-index:2;font-family:var(--mono);font-size:9px;
    padding:2px 5px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#e8e8e8;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .key .badge{position:absolute;top:3px;right:3px;z-index:3;font-family:var(--mono);font-size:11px;
    width:20px;height:20px;display:flex;align-items:center;justify-content:center;border:1px solid;
    background:rgba(0,0,0,.7);cursor:pointer;}
  .key .badge.loop{color:var(--green);border-color:var(--green);}
  .key .badge.once{color:var(--dim);border-color:var(--faint);}
  .key .badge.strobe{color:var(--cyan);border-color:var(--cyan);font-size:9px;cursor:default;}
  .key .del{position:absolute;top:3px;left:3px;z-index:3;font-family:var(--mono);font-size:11px;
    width:20px;height:20px;display:none;align-items:center;justify-content:center;
    border:1px solid var(--red);color:var(--red);background:rgba(0,0,0,.7);cursor:pointer;}
  .key:hover .del{display:flex;}

  /* selection / detail panel */
  #detail{display:flex;align-items:center;gap:14px;padding:9px 16px;border-top:1px solid var(--line);
    background:var(--panel);min-height:52px;font-size:12px;flex-wrap:wrap;}
  #detail .none{color:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:1px;}
  #detail .selname{font-family:var(--mono);color:var(--cyan);font-size:12px;}
  .slider{display:flex;align-items:center;gap:8px;}
  input[type=range]{width:140px;accent-color:var(--cyan);}
  .val{font-family:var(--mono);font-size:11px;color:var(--ink);min-width:54px;}

  .hint{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.5px;}
  #status{font-family:var(--mono);font-size:10px;letter-spacing:1px;}
  #status.live{color:var(--green);}
  #status.off{color:var(--amber);}

  /* ===== PREVIEW（control内・出力ミラー） ===== */
  #preview{position:relative;flex:1 1 0;min-width:0;border:1px solid var(--line2);background:#000;display:flex;flex-direction:column;}
  #preview .pvbar{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--dim);padding:3px 7px;background:#0c0c0c;border-bottom:1px solid var(--line);}
  #preview #pvstate{color:var(--faint);font-size:8px;}
  #preview.playing #pvstate{color:var(--green);}
  #pvwrap{position:relative;flex:1 1 0;width:100%;background:#000;overflow:hidden;}
  #pvwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .6s linear;}
  #pvStrobe{position:absolute;inset:0;opacity:0;background:#fff;pointer-events:none;}

  /* ===================== OUTPUT ===================== */
  #output{position:fixed;inset:0;background:#000;overflow:hidden;}
  #output video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;
    opacity:0;transition:opacity .6s linear;}
  #strobe{position:absolute;inset:0;opacity:0;pointer-events:none;background:#fff;}
  #outhint{position:absolute;left:0;right:0;bottom:0;padding:10px;text-align:center;
    font-family:var(--mono);font-size:11px;color:#444;letter-spacing:1px;z-index:10;}
  #fsbtn{position:absolute;top:12px;right:12px;z-index:10;}
  #output.playing #outhint, #output.playing #fsbtn{display:none;}
</style>
</head>
<body>

<!-- ===================== CONTROL VIEW ===================== -->
<div id="control" style="display:none">
  <div id="preview" title="出力中の内容（手元プレビュー）">
    <div class="pvbar"><span>PREVIEW / 出力中</span><span id="pvstate">&#9679;</span></div>
    <div id="pvwrap">
      <video id="pvA" muted playsinline></video>
      <video id="pvB" muted playsinline></video>
      <div id="pvStrobe"></div>
    </div>
  </div>
  <header>
    <span class="brand">VJ<span class="dot">.</span>STUDIO</span>

    <div class="grp">
      <span class="lab">出力</span>
      <button id="openOut" class="go">出力画面を開く</button>
      <span id="status" class="off">OUTPUT OFF</span>
    </div>

    <div class="grp">
      <span class="lab">切替</span>
      <div class="toggle" id="fadeModeTog">
        <button data-mode="cut" class="on">CUT</button>
        <button data-mode="xfade">X-FADE</button>
      </div>
    </div>

    <div class="grp slider">
      <span class="lab">X-FADE 秒</span>
      <input type="range" id="xfadeSec" min="0.2" max="4" step="0.1" value="0.6">
      <span class="val" id="xfadeVal">0.6s</span>
    </div>

    <span class="spacer"></span>

    <div class="grp slider">
      <span class="lab">FADE OUT 秒</span>
      <input type="range" id="foSec" min="0.2" max="6" step="0.1" value="1.5">
      <span class="val" id="foVal">1.5s</span>
    </div>
    <button id="fadeOutBtn" class="warn">FADE OUT (ESC)</button>

    <div class="grp">
      <span class="lab">プリセット</span>
      <div class="palette">
        <div class="preset white" draggable="true" data-preset="strobe-white">白<br>STROBE</div>
        <div class="preset black" draggable="true" data-preset="strobe-black">黒<br>STROBE</div>
      </div>
    </div>

    <button id="loadSet" class="go" title="前回組んだ素材を読み込んで再生できる状態にします">セット読込</button>
  </header>

  <div id="stage">
    <div id="keyboard"></div>
  </div>

  <div id="detail">
    <span class="none" id="detailNone">キーをクリックすると、ここでループや間隔を設定できます。&nbsp; / &nbsp;ハードディスクから動画をキーへドラッグ&ドロップで割り当て。</span>
  </div>
</div>

<!-- ===================== OUTPUT VIEW ===================== -->
<div id="output" style="display:none">
  <video id="vA" playsinline></video>
  <video id="vB" playsinline></video>
  <div id="strobe"></div>
  <button id="fsbtn" class="go">このモニターで全画面</button>
  <div id="outhint">VJ STUDIO — OUTPUT &nbsp;|&nbsp; この画面をサブモニターへ移動し「全画面」を押してください</div>
</div>

<script>
"use strict";
const IS_OUTPUT = new URLSearchParams(location.search).get('role') === 'output';
const BC = new BroadcastChannel('vj-studio');

/* ============================================================
   KEYBOARD LAYOUT  (codeで管理 → レイアウト非依存)
   ============================================================ */
const LAYOUT = [
  [['Backquote','`'],['Digit1','1'],['Digit2','2'],['Digit3','3'],['Digit4','4'],['Digit5','5'],['Digit6','6'],['Digit7','7'],['Digit8','8'],['Digit9','9'],['Digit0','0'],['Minus','-'],['Equal','=']],
  [['KeyQ','Q'],['KeyW','W'],['KeyE','E'],['KeyR','R'],['KeyT','T'],['KeyY','Y'],['KeyU','U'],['KeyI','I'],['KeyO','O'],['KeyP','P'],['BracketLeft','[' ],['BracketRight',']'],['Backslash','\\']],
  [['KeyA','A'],['KeyS','S'],['KeyD','D'],['KeyF','F'],['KeyG','G'],['KeyH','H'],['KeyJ','J'],['KeyK','K'],['KeyL','L'],['Semicolon',';'],['Quote','\'']],
  [['KeyZ','Z'],['KeyX','X'],['KeyC','C'],['KeyV','V'],['KeyB','B'],['KeyN','N'],['KeyM','M'],['Comma',','],['Period','.'],['Slash','/']],
  [['Space','SPACE']],
];

/* ============================================================
   INDEXEDDB
   ============================================================ */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('vj-studio', 1);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if(!d.objectStoreNames.contains('handles')) d.createObjectStore('handles');
      if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings');
    };
    r.onsuccess = e=>{ db = e.target.result; res(db); };
    r.onerror = e=>rej(e);
  });
}
function idbPut(store,key,val){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).put(val,key);t.oncomplete=()=>res();t.onerror=e=>rej(e);});}
function idbGet(store,key){return new Promise((res,rej)=>{const t=db.transaction(store,'readonly');const rq=t.objectStore(store).get(key);rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e);});}
function idbDel(store,key){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=()=>res();t.onerror=e=>rej(e);});}
function idbAll(store){return new Promise((res,rej)=>{const t=db.transaction(store,'readonly');const rq=t.objectStore(store).getAll();const rk=t.objectStore(store).getAllKeys();let v,k;rq.onsuccess=()=>{v=rq.result;if(k)res(v.map((val,i)=>[k[i],val]));};rk.onsuccess=()=>{k=rk.result;if(v)res(v.map((val,i)=>[k[i],val]));};t.onerror=e=>rej(e);});}

/* ============================================================
   共通：再生エンジン（出力ウィンドウ／手元プレビュー 両方で使用）
   File を受け取り、各コンテキストで blob URL を生成 → 別ウィンドウでも確実に再生。
   自動再生を確実にするため muted で再生（音は将来 解禁ボタンで対応）。
   ============================================================ */
function createPlayer(vA, vB, strobe, rootEl){
  let activeEl=vA, idleEl=vB, strobeTimer=null, strobeKey=null;
  const objUrls=new Map();
  function setSrc(el,file){
    const old=objUrls.get(el);
    const u=URL.createObjectURL(file); objUrls.set(el,u); el.src=u;
    if(old) setTimeout(()=>{ try{URL.revokeObjectURL(old);}catch(_){} },800);
  }
  function blackout(){
    [vA,vB].forEach(v=>{ v.style.transition='none'; v.style.opacity=0; try{v.pause();}catch(e){} });
    stopStrobe(); if(rootEl) rootEl.classList.remove('playing');
  }
  function stopStrobe(){ if(strobeTimer){clearInterval(strobeTimer);strobeTimer=null;} strobe.style.opacity=0; strobeKey=null; }
  function runStrobe(color,interval,key){
    if(strobeKey===key){ stopStrobe(); return; }   // 同じストロボキー再押下 → 停止
    stopStrobe(); strobeKey=key;
    strobe.style.background=(color==='white')?'#fff':'#000';
    let vis=true; const half=Math.max(20,interval/2);
    strobe.style.opacity=1;
    strobeTimer=setInterval(()=>{ vis=!vis; strobe.style.opacity=vis?1:0; }, half);
    if(rootEl) rootEl.classList.add('playing');
  }
  function playVideo(msg){
    const next=idleEl, cur=activeEl;
    try{
      next.loop=!!msg.loop; next.muted=true; next.playsInline=true;
      next.onerror=()=>blackout();
      next.onended=()=>{ if(!next.loop){ next.style.transition='opacity .4s linear'; next.style.opacity=0; setTimeout(()=>{ try{next.pause();}catch(e){} },420);} };
      if(msg.file) setSrc(next,msg.file); else if(msg.url) next.src=msg.url;
      next.currentTime=0;
      const p=next.play(); if(p&&p.catch)p.catch(()=>{});
      if(rootEl) rootEl.classList.add('playing');
      if(msg.fadeMode==='xfade'){
        const sec=msg.xfadeSec||0.6;
        next.style.transition=`opacity ${sec}s linear`; cur.style.transition=`opacity ${sec}s linear`;
        requestAnimationFrame(()=>{ next.style.opacity=1; cur.style.opacity=0; });
        setTimeout(()=>{ if(cur!==next){ try{cur.pause();}catch(e){} } }, sec*1000+60);
      }else{ // CUT
        next.style.transition='none'; next.style.opacity=1;
        cur.style.transition='none'; cur.style.opacity=0;
        if(cur!==next){ try{cur.pause();}catch(e){} }
      }
      activeEl=next; idleEl=cur;
    }catch(e){ blackout(); }
  }
  function fadeOutAll(sec){
    [vA,vB].forEach(v=>{ v.style.transition=`opacity ${sec}s linear`; v.style.opacity=0; setTimeout(()=>{ try{v.pause();}catch(e){} },sec*1000+60); });
    strobe.style.transition=`opacity ${sec}s linear`; strobe.style.opacity=0;
    setTimeout(()=>{ stopStrobe(); strobe.style.transition=''; if(rootEl) rootEl.classList.remove('playing'); }, sec*1000+80);
  }
  function handle(m){
    if(m.t==='play'){ if(m.kind==='strobe') runStrobe(m.color,m.interval,m.key); else playVideo(m); }
    else if(m.t==='fadeout'){ fadeOutAll(m.sec||1.5); }
    else if(m.t==='blackout'){ blackout(); }
  }
  return { handle, blackout };
}

/* ============================================================
   ============  OUTPUT  WINDOW  ===============================
   ============================================================ */
if(IS_OUTPUT){
  document.getElementById('output').style.display='block';
  document.title = 'VJ STUDIO — OUTPUT';
  const out = document.getElementById('output');
  const player = createPlayer(document.getElementById('vA'), document.getElementById('vB'), document.getElementById('strobe'), out);
  document.getElementById('fsbtn').onclick = ()=>{ out.requestFullscreen && out.requestFullscreen().catch(()=>{}); };
  BC.onmessage = (e)=>{ const m=e.data; if(m.t==='ping'){ BC.postMessage({t:'pong'}); return; } player.handle(m); };
  BC.postMessage({t:'pong'});
  window.addEventListener('beforeunload',()=>BC.postMessage({t:'outclosed'}));
}

/* ============================================================
   ============  CONTROL  WINDOW  LOGIC  =======================
   ============================================================ */
if(!IS_OUTPUT){
  document.getElementById('control').style.display='flex';

  const state = {
    assignments:{},          // code -> {kind, name, url, thumb, loop, color, interval, hasHandle}
    fadeMode:'cut',
    xfadeSec:0.6,
    foSec:1.5,
    selected:null,
    outOpen:false,
  };
  let outWin = null;
  const preview = createPlayer(document.getElementById('pvA'), document.getElementById('pvB'), document.getElementById('pvStrobe'), document.getElementById('preview'));

  /* ---------- build keyboard ---------- */
  const kb = document.getElementById('keyboard');
  function buildKeyboard(){
    kb.innerHTML='';
    LAYOUT.forEach((row,ri)=>{
      const rEl=document.createElement('div'); rEl.className='krow';
      // 各行先頭に固定の特殊キー風表示（見やすさ）
      if(ri===2){ rEl.appendChild(specialKey('TAB','wide-pad')); }
      row.forEach(([code,label])=>{
        rEl.appendChild(makeKey(code,label));
      });
      if(ri===2){ rEl.appendChild(specialKey('ENTER','wide')); }
      if(ri===0){ rEl.appendChild(specialKey('ESC ▸ FADE','wide','fade')); }
      if(ri===LAYOUT.length-1){ rEl.classList.add('krow-bottom'); const pv=document.getElementById('preview'); if(pv) rEl.appendChild(pv); }
      kb.appendChild(rEl);
    });
  }
  function specialKey(text,cls,role){
    const k=document.createElement('div'); k.className='key special '+(cls||'');
    if(role==='fade'){ k.title='ESCキーでフェードアウト'; }
    k.innerHTML=`<span class="klabel">${text}</span>`;
    return k;
  }
  function makeKey(code,label){
    const k=document.createElement('div');
    k.className='key'; k.dataset.code=code;
    if(label==='SPACE') k.classList.add('wider');
    k.innerHTML=`<div class="thumb"></div><span class="klabel">${label}</span>`;
    // events
    k.addEventListener('click',(e)=>{ if(e.target.closest('.badge')||e.target.closest('.del'))return; selectKey(code); });
    k.addEventListener('dblclick',()=>{ if(state.assignments[code]) triggerKey(code); });
    // drag & drop
    k.addEventListener('dragover',e=>{e.preventDefault();k.classList.add('dragover');});
    k.addEventListener('dragleave',()=>k.classList.remove('dragover'));
    k.addEventListener('drop',e=>{e.preventDefault();k.classList.remove('dragover');handleDrop(code,e);});
    return k;
  }

  function keyEl(code){ return kb.querySelector(`.key[data-code="${CSS.escape(code)}"]`); }

  function renderKey(code){
    const k=keyEl(code); if(!k) return;
    const a=state.assignments[code];
    k.classList.remove('strobe-white','strobe-black');
    const thumb=k.querySelector('.thumb');
    k.querySelectorAll('.badge,.del,.name').forEach(n=>n.remove());
    if(!a){ thumb.style.background=''; thumb.style.backgroundImage=''; return; }
    // strobe styling
    if(a.kind==='strobe'){ k.classList.add(a.color==='white'?'strobe-white':'strobe-black'); thumb.style.backgroundImage=''; }
    else { thumb.style.backgroundColor = a.thumb?'transparent':'#1a1a1a'; thumb.style.backgroundImage = a.thumb?`url(${a.thumb})`:''; }
    // name
    const nm=document.createElement('div'); nm.className='name';
    nm.textContent = a.kind==='strobe' ? (a.color==='white'?'白ストロボ':'黒ストロボ') : a.name;
    k.appendChild(nm);
    // badge
    const b=document.createElement('div');
    if(a.kind==='strobe'){ b.className='badge strobe'; b.textContent='ST'; b.title='ストロボ'; }
    else if(a.loop){ b.className='badge loop'; b.textContent='∞'; b.title='ループ中（クリックで1回に）'; b.onclick=ev=>{ev.stopPropagation();toggleLoop(code);}; }
    else { b.className='badge once'; b.textContent='1'; b.title='1回で黒に落ちる（クリックでループに）'; b.onclick=ev=>{ev.stopPropagation();toggleLoop(code);}; }
    k.appendChild(b);
    // delete
    const d=document.createElement('div'); d.className='del'; d.textContent='×'; d.title='割り当て解除';
    d.onclick=ev=>{ev.stopPropagation();clearKey(code);};
    k.appendChild(d);
  }

  /* ---------- drop handling ---------- */
  async function handleDrop(code,e){
    // 1) preset (strobe) ?
    const preset = e.dataTransfer.getData('application/x-vj-preset');
    if(preset){
      const color = preset==='strobe-white'?'white':'black';
      state.assignments[code] = {kind:'strobe', color, interval:80};
      renderKey(code); selectKey(code);
      persist(code);
      return;
    }
    // 2) file ?
    const items = e.dataTransfer.items;
    let handle=null, file=null;
    if(items && items.length){
      const it=items[0];
      if(it.kind!=='file') return;
      // ★ DataTransferItem は await を挟むと無効化される。同期で先に File を取り出す。
      file = it.getAsFile();
      const hp = it.getAsFileSystemHandle ? it.getAsFileSystemHandle() : null; // 呼び出しは同期
      if(hp){ try{ handle=await hp; }catch(_){} }
    }else if(e.dataTransfer.files && e.dataTransfer.files.length){
      file = e.dataTransfer.files[0];
    }
    if(handle && handle.kind==='file' && !file){ try{file=await handle.getFile();}catch(_){} }
    if(!file){ return; }
    if(!/^video\//.test(file.type) && !/\.(mp4|webm|mov|m4v|ogv)$/i.test(file.name)){
      flashDetail('動画ファイルではないようです: '+file.name); return;
    }
    // revoke old url
    if(state.assignments[code] && state.assignments[code].url) URL.revokeObjectURL(state.assignments[code].url);
    const url = URL.createObjectURL(file);
    const a = {kind:'video', name:file.name, file, url, thumb:'', loop:true, hasHandle:!!handle};
    state.assignments[code]=a;
    renderKey(code); selectKey(code);
    // save handle for persistence
    if(handle){ try{ await idbPut('handles',code,handle); }catch(_){} }
    else { idbDel('handles',code).catch(()=>{}); }
    // thumbnail (async)
    makeThumb(url).then(async t=>{ a.thumb=t; renderKey(code); await persist(code); });
    await persist(code);
  }

  function makeThumb(url){
    return new Promise(res=>{
      const v=document.createElement('video');
      v.muted=true; v.preload='metadata'; v.src=url;
      let done=false; const fin=val=>{if(!done){done=true;res(val);}};
      v.addEventListener('loadeddata',()=>{ try{ v.currentTime=Math.min((v.duration||2)*0.15, 1.5)||0.1; }catch(e){ fin(''); } });
      v.addEventListener('seeked',()=>{
        try{
          const w=400, ratio=(v.videoHeight/v.videoWidth)||0.5625, h=Math.round(w*ratio);
          const c=document.createElement('canvas'); c.width=w; c.height=h;
          c.getContext('2d').drawImage(v,0,0,w,h);
          fin(c.toDataURL('image/jpeg',0.72));
        }catch(e){ fin(''); }
      });
      v.addEventListener('error',()=>fin(''));
      setTimeout(()=>fin(''),4000);
    });
  }

  /* ---------- persistence ---------- */
  async function persist(code){
    const a=state.assignments[code];
    if(!a){ await idbDel('meta',code); await idbDel('handles',code); return; }
    const meta={kind:a.kind,name:a.name||'',thumb:a.thumb||'',loop:!!a.loop,color:a.color||null,interval:a.interval||80};
    await idbPut('meta',code,meta);
  }
  async function saveSettings(){
    await idbPut('settings','main',{fadeMode:state.fadeMode,xfadeSec:state.xfadeSec,foSec:state.foSec});
  }

  async function loadAll(){
    const metas = await idbAll('meta');
    for(const [code,m] of metas){
      state.assignments[code] = {kind:m.kind,name:m.name,thumb:m.thumb,loop:m.loop,color:m.color,interval:m.interval,url:'',hasHandle:false,needsLoad:m.kind==='video'};
      renderKey(code);
    }
    const s=await idbGet('settings','main');
    if(s){ state.fadeMode=s.fadeMode||'cut'; state.xfadeSec=s.xfadeSec||0.6; state.foSec=s.foSec||1.5; }
    syncSettingsUI();
    const need = Object.values(state.assignments).some(a=>a.needsLoad);
    if(need) flashDetail('前回のセットを読み込みました。再生するには「セット読込」を押してください。');
  }

  // 「セット読込」: 保存済みハンドルから権限取得→url再生成
  async function loadSet(){
    const handles=await idbAll('handles');
    let ok=0, fail=0;
    for(const [code,h] of handles){
      const a=state.assignments[code]; if(!a) continue;
      try{
        let perm=await h.queryPermission({mode:'read'});
        if(perm!=='granted') perm=await h.requestPermission({mode:'read'});
        if(perm!=='granted'){ fail++; continue; }
        const file=await h.getFile();
        a.file=file;
        if(a.url) URL.revokeObjectURL(a.url);
        a.url=URL.createObjectURL(file); a.needsLoad=false; ok++;
        if(!a.thumb){ makeThumb(a.url).then(t=>{a.thumb=t;renderKey(code);persist(code);}); }
      }catch(_){ fail++; }
    }
    flashDetail(`読込完了：再生可 ${ok} 件${fail?` / 失敗 ${fail} 件（素材が移動/削除された可能性）`:''}`);
  }

  /* ---------- selection / detail ---------- */
  function selectKey(code){
    state.selected=code;
    kb.querySelectorAll('.key.sel').forEach(k=>k.classList.remove('sel'));
    const k=keyEl(code); if(k) k.classList.add('sel');
    renderDetail();
  }
  const detail=document.getElementById('detail');
  function renderDetail(){
    const code=state.selected; const a=code?state.assignments[code]:null;
    if(!code){ detail.innerHTML='<span class="none">キーをクリックすると、ここでループや間隔を設定できます。</span>'; return; }
    const label = labelOf(code);
    if(!a){
      detail.innerHTML=`<span class="selname">[${label}]</span><span class="hint">空きキー。動画をドラッグ&ドロップ、またはプリセットをドロップ。</span>`;
      return;
    }
    if(a.kind==='strobe'){
      detail.innerHTML=`<span class="selname">[${label}] ${a.color==='white'?'白ストロボ':'黒ストロボ'}</span>
        <div class="slider"><span class="lab">点滅の速さ（間隔）</span>
        <input type="range" id="dInterval" min="20" max="400" step="5" value="${a.interval}">
        <span class="val" id="dIntervalV">${a.interval}ms</span></div>
        <button id="dTest" class="go">テスト点灯</button>
        <button id="dDel" class="danger">割り当て解除</button>`;
      const ri=document.getElementById('dInterval');
      ri.oninput=()=>{ a.interval=+ri.value; document.getElementById('dIntervalV').textContent=a.interval+'ms'; persist(code); };
      document.getElementById('dTest').onclick=()=>triggerKey(code);
      document.getElementById('dDel').onclick=()=>clearKey(code);
    }else{
      detail.innerHTML=`<span class="selname">[${label}]</span><span class="hint">${a.name}</span>
        <div class="toggle" id="dLoop">
          <button data-loop="1" class="${a.loop?'on':''}">∞ ループ</button>
          <button data-loop="0" class="${!a.loop?'on':''}">1回で黒</button>
        </div>
        ${a.needsLoad?'<span class="hint" style="color:var(--amber)">未読込（セット読込を押す）</span>':''}
        <button id="dTest" class="go">テスト再生</button>
        <button id="dDel" class="danger">割り当て解除</button>`;
      document.getElementById('dLoop').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; setLoop(code,b.dataset.loop==='1'); };
      document.getElementById('dTest').onclick=()=>triggerKey(code);
      document.getElementById('dDel').onclick=()=>clearKey(code);
    }
  }
  function labelOf(code){
    for(const row of LAYOUT) for(const [c,l] of row) if(c===code) return l;
    return code;
  }
  let detailTimer=null;
  function flashDetail(msg){
    detail.innerHTML=`<span class="hint" style="color:var(--cyan)">${msg}</span>`;
    clearTimeout(detailTimer); detailTimer=setTimeout(renderDetail,4000);
  }

  function toggleLoop(code){ const a=state.assignments[code]; if(a&&a.kind==='video'){ setLoop(code,!a.loop);} }
  function setLoop(code,v){ const a=state.assignments[code]; if(!a)return; a.loop=v; renderKey(code); persist(code); if(state.selected===code)renderDetail(); }
  function clearKey(code){
    const a=state.assignments[code];
    if(a&&a.url) URL.revokeObjectURL(a.url);
    delete state.assignments[code];
    idbDel('meta',code); idbDel('handles',code);
    renderKey(code);
    if(state.selected===code) renderDetail();
  }

  /* ---------- trigger / playback ---------- */
  function triggerKey(code){
    const a=state.assignments[code]; if(!a) return;
    flashKey(code);
    let msg;
    if(a.kind==='strobe'){
      msg={t:'play',kind:'strobe',color:a.color,interval:a.interval,key:code};
    }else{
      if(a.needsLoad || !a.file){ flashDetail('このキーは未読込です。「セット読込」を押してください。'); return; }
      msg={t:'play',kind:'video',file:a.file,loop:a.loop,fadeMode:state.fadeMode,xfadeSec:state.xfadeSec,key:code};
    }
    preview.handle(msg);                    // 手元プレビュー（常に再生）
    if(state.outOpen) BC.postMessage(msg);  // 出力ウィンドウ（開いていれば）
  }
  function flashKey(code){ const k=keyEl(code); if(!k)return; k.classList.add('flash'); setTimeout(()=>k.classList.remove('flash'),130); }
  function fadeOut(){ const msg={t:'fadeout',sec:state.foSec}; preview.handle(msg); if(state.outOpen) BC.postMessage(msg); }

  /* ---------- physical keyboard ---------- */
  window.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea') return;
    if(e.code==='Escape'){ e.preventDefault(); fadeOut(); return; }
    if(e.repeat) return;
    if(state.assignments[e.code]){ e.preventDefault(); triggerKey(e.code); }
  });

  /* ---------- output window ---------- */
  function openOutput(){
    // ★ ポップアップブロック回避：クリック直後に await を挟まず同期で開く
    outWin=window.open('?role=output','vjOutput','width=1280,height=720,menubar=no,toolbar=no,location=no,status=no');
    if(!outWin){ flashDetail('ポップアップがブロックされました。アドレスバー右の「ポップアップ」を許可してください。'); return; }
    setOut(true);
    // 位置・サイズをサブモニターへ（権限があればベストエフォート。失敗してもブロックには影響しない）
    if('getScreenDetails' in window){
      window.getScreenDetails().then(sd=>{
        const ext = sd.screens.find(s=>!s.isPrimary) || sd.screens.find(s=>s!==sd.currentScreen);
        if(ext && outWin && !outWin.closed){
          try{ outWin.moveTo(ext.left, ext.top); outWin.resizeTo(ext.availWidth||ext.width, ext.availHeight||ext.height); }catch(_){}
        }
      }).catch(()=>{});
    }
  }
  function setOut(v){
    state.outOpen=v;
    const s=document.getElementById('status');
    s.textContent=v?'OUTPUT LIVE':'OUTPUT OFF';
    s.className=v?'live':'off';
  }
  // pong / outclosed
  BC.onmessage=(e)=>{
    if(e.data.t==='pong') setOut(true);
    else if(e.data.t==='outclosed') setOut(false);
  };
  // 出力ウィンドウが閉じられた監視
  setInterval(()=>{ if(outWin && outWin.closed){ outWin=null; setOut(false);} },1000);

  /* ---------- header controls ---------- */
  document.getElementById('openOut').onclick=openOutput;
  document.getElementById('fadeOutBtn').onclick=fadeOut;
  document.getElementById('loadSet').onclick=loadSet;
  document.getElementById('fadeModeTog').onclick=e=>{
    const b=e.target.closest('button'); if(!b)return;
    state.fadeMode=b.dataset.mode;
    document.querySelectorAll('#fadeModeTog button').forEach(x=>x.classList.toggle('on',x===b));
    saveSettings();
  };
  const xs=document.getElementById('xfadeSec');
  xs.oninput=()=>{ state.xfadeSec=+xs.value; document.getElementById('xfadeVal').textContent=xs.value+'s'; saveSettings(); };
  const fo=document.getElementById('foSec');
  fo.oninput=()=>{ state.foSec=+fo.value; document.getElementById('foVal').textContent=fo.value+'s'; saveSettings(); };

  function syncSettingsUI(){
    document.querySelectorAll('#fadeModeTog button').forEach(x=>x.classList.toggle('on',x.dataset.mode===state.fadeMode));
    xs.value=state.xfadeSec; document.getElementById('xfadeVal').textContent=state.xfadeSec+'s';
    fo.value=state.foSec; document.getElementById('foVal').textContent=state.foSec+'s';
  }

  // preset drag
  document.querySelectorAll('.preset').forEach(p=>{
    p.addEventListener('dragstart',e=>{ e.dataTransfer.setData('application/x-vj-preset',p.dataset.preset); });
  });

  /* ---------- boot ---------- */
  (async ()=>{
    buildKeyboard();
    await openDB();
    await loadAll();
    renderDetail();
  })();
}
</script>
</body>
</html>
